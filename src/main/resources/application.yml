spring:
  application:
    name: nevis-search

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nevis}
    username: ${SPRING_DATASOURCE_USERNAME:nevis}
    password: ${SPRING_DATASOURCE_PASSWORD:nevis}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (including the vector column and generated columns,
      # which Hibernate cannot model). Never let Hibernate touch DDL.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

  ai:
    embedding:
      transformer:
        # Left blank for local dev: Spring AI falls back to its bundled default
        # artifacts. In Docker these point at the model baked in at build time:
        #   onnx.model-uri: file:/opt/model/model.onnx
        #   tokenizer.uri:  file:/opt/model/tokenizer.json
        onnx:
          model-uri: ${SPRING_AI_EMBEDDING_TRANSFORMER_ONNX_MODEL_URI:}
        tokenizer:
          uri: ${SPRING_AI_EMBEDDING_TRANSFORMER_TOKENIZER_URI:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

nevis:
  search:
    limit-default: 20
    limit-max: 100
    channel-depth: 50      # rows per query before fusion
    rrf-k: 60
    semantic-floor: 0.20   # cosine similarity — model-specific, tuned empirically:
                           #   "address proof" keeps the utility bill (~0.24) while
                           #   the portfolio note (~0.06) and off-topic queries are
                           #   dropped. Re-tune for a different embedding model.
    client-floor: 0.30     # trigram similarity

  llm:
    # The API key is the feature flag. With ANTHROPIC_API_KEY set, documents are
    # summarised by a hosted model; unset, the app falls back to an extractive
    # summary and makes no network calls. A clean clone runs with no key.
    enabled: true
    api-key: ${ANTHROPIC_API_KEY:}   # empty string when the env var is absent
    model: claude-opus-4-8
    timeout-ms: 20000
    query-timeout-ms: 2000           # read-path parser budget; falls back safely
    max-summary-chars: 160           # length of the extractive fallback summary
    parse-queries: true              # split "concept of client" queries (read path; needs a key)
